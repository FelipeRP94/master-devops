services:
  calendar-db:
    image: mongo
    volumes:
      - calendar-data:/data/db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: lemoncode
    networks:
      - calendar-network-node

  calendar-backend:
    depends_on:
      - calendar-db
    build:
      context: ./backend
    ports:
      - "5000:5000"
    restart: always
    environment:
      DATABASE_URL: mongodb://admin:lemoncode@calendar-db:27017
      DATABASE_NAME: LemoncodeCourseDb
      PORT: 5000
    networks:
      - calendar-network-node

  calendar-frontend:
    depends_on:
      - calendar-backend
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    restart: always
    environment:
      API_URL: http://calendar-backend:5000/api/classes
    networks:
      - calendar-network-node

volumes:
  calendar-data:

networks:
  calendar-network-node:
