apiVersion: v1
kind: PersistentVolume
metadata:
  name: todo-app-data-pv
spec:
  capacity:
    storage: 100Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Recycle
  storageClassName: todo-app-data-sc
  hostPath:
    path: /data/pv0001
    type: DirectoryOrCreate
