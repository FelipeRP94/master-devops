apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-ingress
  labels:
    app.kubernetes.io/name: todo-ingress
spec:
  rules:
    - host: 127-0-0-1.nip.io
      http:
        paths:
          - pathType: Prefix
            path: "/api"
            backend:
              service:
                name: todo-api-service
                port:
                  number: 3000
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: todo-front-service
                port:
                  name: http
