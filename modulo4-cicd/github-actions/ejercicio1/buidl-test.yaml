name: Build and Test

on:
  pull_request:
    branches: [main]
    paths:
      - "modulo4-cicd/github-actions/hangman-front/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulo4-cicd/github-actions/hangman-front

    steps:
      - uses: actions/checkout@v3
      - name: Set up Hangman Frontend
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - name: Install dependencies
        run: npm install
      - name: Build the project
        run: npm run build
      - name: Run tests
        run: npm test
