name: Publish Docker Image

on:
  workflow_dispatch:
    paths:
      - "modulo4-cicd/github-actions/hangman-front/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: feliperp94/hangman-front

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulo4-cicd/github-actions/hangman-front

    steps:
      - uses: actions/checkout@v3
      - name: Set up Hangman Frontend
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./modulo4-cicd/github-actions/hangman-front
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
