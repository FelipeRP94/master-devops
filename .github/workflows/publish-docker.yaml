name: Publish Docker Image

on:
  workflow_dispatch:
    paths:
      - "modulo4-cicd/github-actions/hangman-front/**"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulo4-cicd/github-actions/hangman-front

    steps:
      - uses: actions/checkout@v3
      - name: Set up Hangman Frontend
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ github.actor }}/hangman-front:latest
